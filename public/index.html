<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mutagen 同步面板</title>
  <link rel="icon" id="favicon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script>
    (function () {
      var t = localStorage.getItem('mp.theme') || 'auto';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13l-3.5-3.5"/><path d="M20 15H7l3.5 3.5"/></svg></span>
        <div class="brand-text">
          <h1>Mutagen 同步面板</h1>
          <button class="daemon-pill" id="daemon-pill" data-act="daemon-menu" title="守护进程"></button>
        </div>
      </div>
      <label class="search">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="筛选会话、路径、主机" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="top-actions" id="top-actions"></div>
    </div>
  </header>

  <div id="banner"></div>

  <main class="page">
    <section class="server-bar" id="server-bar"></section>
    <section class="stats" id="stats"></section>
    <section class="toolbar">
      <div class="chips" id="chips"></div>
      <div class="toolbar-right" id="toolbar-right"></div>
    </section>
    <div id="main"></div>
  </main>

  <div id="popover" class="popover" hidden></div>
  <div id="toasts" class="toasts"></div>
  <script src="/app.js"></script>
</body>
</html>
